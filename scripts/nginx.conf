server {
    listen 80;

    access_log off;
    error_log /dev/stderr warn;

    root /app/var;

    location /static/ {
        expires 30d;
    }

    location /media/ {
        expires 30d;
    }

    location / {
        proxy_set_header Accept-Language "";
        proxy_set_header Host $host;
        proxy_pass http://web:8000;
    }
}
